            fi
          fi
          tag="pru-build-$(git rev-parse --short=10 HEAD)"
          if test "$GITHUB_REF" = "refs/heads/feat/pru-job18-final-story-dragonite-20261106"; then
            file="Pokemon-Relics-Ultimate-Job18-${GITHUB_SHA:0:10}.gba"
            release_title="Pokémon Relics Ultimate — Job 18 Test Release"
          elif test "$GITHUB_REF" = "refs/heads/fix/pru-finale-names-item-cleanup-20261106"; then
            file="Pokemon-Relics-Ultimate-PR75-${GITHUB_SHA:0:10}.gba"
            release_title="Pokémon Relics Ultimate — PR75 Test Build"
          else
            file="Pokemon-Relics-Ultimate-${GITHUB_SHA:0:10}.gba"
            release_title="Pokémon Relics Ultimate — build ${GITHUB_SHA:0:10}"
          fi
          cp pokehns.gba "$RUNNER_TEMP/$file"
