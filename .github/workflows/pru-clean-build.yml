name: PRU canonical clean build

on:
  push:
    branches: [main, fix/pru-indigo-tutors-20261027, fix/pru-a4d-mewduo-merge, fix/pru-challenges-mart-groudon-20261030, feat/pru-locked-gmax-charaxis-polish-20261031, feat/pru-relic-hunt-20261101]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

# Each build is independent: never supersede a queued ROM build.
# Pull requests compile for review. The isolated Indigo repair branch can
# additionally publish via a normal push event, where release permissions are
# available; its PR validation path remains unchanged.
concurrency:
  group: pru-clean-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install proven PJR GBA build dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # The hosted runner's Azure mirror repeatedly drops large ARM toolchain archives.
          # Use Ubuntu's standard archive directly so apt can complete before the step timeout.
          printf '%s\n' 'http://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev libmgba-dev python3 python3-pil mgba-qt mgba-sdl xvfb xdotool imagemagick
      - name: Install original working PJR Jessie James and Steevee Neevee production transition art
        run: |
          set -euo pipefail
          test -s assets/prl_duo_20261011.json
          python3 tools/pru/install_prl_duo_assets.py
          python3 tools/pru/check_prl_duo_palette.py
      - name: Install original approved Meowth balloon sprite and palette
        run: python3 tools/pru/install_original_meowth_balloon.py
      - name: Restore original PJR Infinity donor sprites from checked-in pack
        run: |
          set -euo pipefail
          cat \
            assets/pjr_infinity/parts/part00.txt \
            assets/pjr_infinity/parts/part01.txt \
            assets/pjr_infinity/parts/part02.txt \
            assets/pjr_infinity/fixed/part030.txt \
            assets/pjr_infinity/fixed/part031.txt \
            assets/pjr_infinity/fixed/part032.txt \
            assets/pjr_infinity/fixed/part0330.txt \
            assets/pjr_infinity/fixed/part0331.txt \
            assets/pjr_infinity/fixed/part0332.txt \
            assets/pjr_infinity/fixed/part0333.txt \
            assets/pjr_infinity/parts/part04.txt \
            assets/pjr_infinity/parts/part05.txt \
            assets/pjr_infinity/parts/part06.txt \
            | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          src = Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          approved_non_core = {
              'alphoracle', 'champeon', 'guardeon', 'lepideon', 'obsideon',
              'omeon', 'toxeon', 'sphynxeon', 'jollibird', 'grimfowl',
              'kablowfish', 'sunflorid',
          }
          for species_dir in src.iterdir():
              if not species_dir.is_dir() or species_dir.name not in approved_non_core:
                  continue
              dst = Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              # Preserve the working source's palette-normalized party icons.
              for name in ('front.png', 'back.png'):
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Prepare existing approved RGBA donor sprites for GBA 4bpp without redrawing
        run: python3 tools/pru/prepare_external_donor_art.py
      - name: Install exact approved PJR Chansey Twins sprite from its pinned source
        run: |
          set -euo pipefail
          base64 -d assets/pru_chansey/approved_natural_64.png.b64 > graphics/trainers/front_pics/pru_chansey_twins.png
          echo "aabcca878b1e775d67886aa869e386fc9af99176945af1c377924654393123b1  graphics/trainers/front_pics/pru_chansey_twins.png" | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          a = Image.open('graphics/trainers/front_pics/pru_chansey_twins.png')
          assert a.size == (64, 64) and a.mode == 'P' and a.info.get('transparency') == 0
          assert len(a.getcolors()) <= 16
          print('Exact proven PJR Chansey artwork verified')
          PY
      - name: Import pinned PRL-approved existing sprites and palettes
        run: python3 tools/pru/sync_prl_authoritative_sprites.py
      - name: Restore exact original Infinity battle sprites after PRL sync
        run: python3 tools/pru/install_infinity_sprite_cleanup.py
      - name: Prepare the user-supplied G-Max Blastoise assets
        run: python3 tools/pru/prepare_user_fortotoise.py
      - name: Install approved final-polish sprite donors after PRL sync
        run: python3 tools/pru/install_final_polish_sprites.py
      - name: Install approved black Relic G-Max Charaxis artwork
        run: python3 tools/pru/install_charaxis_gmax_relic.py
      - name: Apply approved Relic starter palettes after PRL sprite sync
        run: python3 tools/pru/install_approved_relic_palettes.py
      - name: Install Insurgence Mega Jirachi from pinned 64x64 donor assets
        run: python3 tools/pru/install_insurgence_mega_jirachi.py
      - name: Install approved TRE P-form legendary bird sprites and palettes
        run: python3 tools/pru/install_p_bird_sprites.py
      - name: Install user-approved Heracurion relic sprite after all donor syncs
        run: python3 tools/pru/install_approved_heracurion.py
      - name: Restore proven Hoenn Last Wish and Noxichu title boot sequence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pru/build_noxichu_intro_trial.py
      - name: Restore proven PJR early Route 30 encounter overlay
        run: python3 tools/pru/add_route30_poochyena.py
      - name: Restore approved Ruins of Alph statue artwork and clear old statue layers
        run: python3 tools/pru/install_ruins_alph_statues.py
      - name: Repair reported PC icon palette collisions and Elite Redux backgrounds
        run: python3 tools/pru/repair_reported_pc_sprites.py
      - name: Install user-provided Mootiny and Miltitan front sprite redraws
        run: python3 tools/pru/install_user_calf_sprites.py
      - name: Restore build-538 Eeveelution artwork at original size
        run: |
          python3 tools/pru/restore_build538_eeveelution_art.py
          python3 tools/pru/check_build538_eeveelutions.py
          python3 tools/pru/check_user_calf_sprite_import.py
      - name: Generate 70-species source audit and preserve inspection save
        run: |
          python3 tools/pru/audit_custom_sprites_70.py
          python3 tools/pru/check_70_sprite_inspection_save.py assets/test_saves/PRU-70-Sprite-Inspection.sav
      - name: Validate the distributed Box 3 sprite QA save
        run: python3 tools/pru/check_sprite_qa_save.py assets/test_saves/Pru.sav
      - name: Run source regression tests
        if: "${{ github.event.head_commit.message != 'ci(pru): package verified PRU ROM after mGBA renderer fix' }}"
        run: |
          python3 test/test_pru_challenges_mart_groudon.py
          set -euo pipefail
          python3 tools/pru/check_crystal_battle_backgrounds.py
          python3 tools/pru/check_rhythm_battle_background_assets.py
          python3 tools/pru/check_rhythm_battle_backgrounds.py
          python3 tools/pru/check_pru_title_screen.py
          python3 tools/pru/install_charaxis_gmax_relic.py
          python3 tools/pru/check_charaxis_gmax_icon.py
          python3 tools/pru/check_golden_ho_oh_icon.py
          python3 tools/pru/check_pru_special_back_sprite_refs.py
          python3 tools/pru/check_pru_e4_rhythm_backgrounds.py
          python3 tools/pru/check_static_battle_backgrounds.py
          python3 tools/pru/check_444_species_dex.py
          python3 tools/pru/check_canonical_eeveelutions.py
          python3 tools/pru/check_evo_dex_discovery.py
          python3 tools/pru/check_lavender_cubone_staging.py
          python3 tools/pru/check_lavender_tower_restoration.py
          python3 tools/pru/check_lavender_graphics_polish.py
          python3 tools/pru/check_nolax_identity.py
          python3 tools/pru/check_custom_back_sprite_offsets.py
          python3 tools/pru/check_pru_444_gameplay.py
          python3 tools/pru/check_20261022_legendary_encounters.py
          python3 tools/pru/check_20261024_kyogre_cave.py
          python3 tools/pru/check_20261024_primal_ace.py
          python3 tools/pru/check_20261025_archie_finale.py
          python3 tools/pru/check_insurgence_mega_jirachi.py
          python3 tools/pru/check_insurgence_space_mew.py
          python3 tools/pru/check_p_bird_sprites.py
          python3 tools/pru/check_astrachi_jirachi_encounter.py
          python3 tools/pru/check_final_polish_sprite_sources.py
          python3 tools/pru/check_reported_pc_sprite_repairs.py
          python3 tools/pru/check_seviian_noibat.py
          python3 tools/pru/check_khang_party_icon_palette.py
          python3 tools/pru/test_ruins_alph_cleanup.py
          python3 tools/pru/check_legendary_catching_respawns.py
          python3 tools/pru/check_golden_hooh.py
          python3 tools/pru/check_dark_void_i_unown.py
          python3 test/test_pru_mystery_egg_seller.py
          python3 test/test_pru_ecruteak_rock_shop.py
          python3 test/test_pru_eeveelution_expert.py
          python3 test/test_pru_sylveon_dex.py
          python3 test/test_pru_false_swipe_escape_rope.py
          python3 test/test_pru_indigo_tutors_scary_face.py
          python3 tools/pru/check_bld_status_icon.py
          python3 tools/pru/check_valkiri_sound.py
          python3 tools/pru/check_skarmet_tourmaline.py
          python3 tools/pru/check_steevee_neevee_encounters.py
          python3 tools/pru/check_bell_tower_statue_placement.py
          python3 tools/pru/check_relic_battle_presentation.py
          python3 tools/test_indigo_control_tutors.py
          python3 tools/pru/check_pru_tutor_party_gate.py
          python3 tools/pru/check_kanto_league_elite18_tutors.py
          python3 tools/pru/check_elite20_visuals.py
          PYTHONPATH=. python3 tools/pru/test_elite20_duo_intros.py
          python3 tools/pru/check_kanto_rooms_hof_credits.py
          python3 tools/pru/check_indigo_support_row.py
          python3 -m unittest -q tools.pru.test_pru_a4d_mewduo_merge tools.pru.test_pru_mewsion_encounter tools.pru.test_pru_shadow_mewtwo tools.pru.test_pru_insurgence_extra_moves
          python3 tools/pru/check_chansey_training.py
          python3 tools/pru/check_pru_e4_oak_elm_dojo_hotfix.py
          python3 tools/pru/check_johto_lati_weather.py
          python3 tools/pru/check_johto_groudon_cave.py
          python3 tools/pru/check_birth_island_byoxys.py
          python3 tools/pru/check_johto_first_clear_ai.py
          python3 tools/pru/check_kanto_gym_custom_rebalance.py
          python3 tools/pru/check_kanto_gym_rewards.py
          python3 tools/pru/check_fuchsia_safari_upgrade_and_kangaskhan.py
      - name: Apply and validate the video-requested sprite repairs last
        run: |
          set -euo pipefail
          python3 tools/pru/check_video_review_sprite_sources.py
          python3 tools/pru/install_video_review_sprite_repairs.py
          python3 tools/pru/check_video_review_sprite_repairs.py
          python3 tools/pru/audit_custom_sprites_70.py
      - name: Run Golden Reign and Phoenix Soul battle-engine tests
        run: |
          set -euo pipefail
          make -j2 check BUILD=hns TESTS=test/battle/move_effects_combined/golden_reign.c
          make -j2 check BUILD=hns TESTS=test/battle/ability/phoenix_soul.c
      - name: Restore pinned PJR multiboot binary build inputs
        shell: bash
        run: |
          set -euo pipefail
          # These files are original build inputs, NOT distributed ROMs.
          # The original PJR source branch included them, but the bootstrap
          # import excluded all *.gba files, including these dependencies.
          donor_commit="6f26a381a13821fd63688cd53dd59de682148bab"
          for file in mb_berry_fix.gba mb_colosseum.gba mb_ereader.gba; do
            if test -s "data/$file"; then
              echo "Build input present: data/$file"
              continue
            fi
            curl --fail --location --retry 3 --connect-timeout 20 \
              "https://raw.githubusercontent.com/jamesthoward2112-tech/Pokemon-Johto-Relics/$donor_commit/data/$file" \
              --output "data/$file"
            test -s "data/$file"
            echo "Restored pinned PJR build input: data/$file"
          done
      - name: Build the original PJR-derived PRU source
        run: |
          set -euo pipefail
          make clean
          # Some approved artwork is checked in only as compiled GBA graphics.
          # clean removes those source-only files; restore their exact tracked bytes.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '*.4bpp', '*.8bpp', '*.gbapal', '*.lz'], text=True).splitlines()
          for name in files:
              path = Path(name)
              source = path.with_suffix('') if path.suffix == '.lz' else path
              if not source.exists() and not source.with_suffix('.png').exists() and not source.with_suffix('.pal').exists():
                  subprocess.run(['git', 'restore', '--', name], check=True)
          PY
          if make hns -j2 -O > /tmp/pru-build.log 2>&1; then
            echo 'ROM compilation completed successfully'
          else
            echo 'First source/compiler/linker errors:'
            grep -n -m 60 -E 'error:|Error:|Failed to open|unsupported color|undefined reference|make: \*\*\*' /tmp/pru-build.log || true
            echo 'Build log tail:'
            tail -n 70 /tmp/pru-build.log
            exit 1
          fi
      - name: Check original Team Rocket compiled walking sprite frames
        run: python3 tools/pru/check_rocket_donor_walk_frames.py
      - name: Verify the compiled 70-species sprite payloads
        run: python3 tools/pru/check_compiled_custom_sprites_70.py
      - name: Verify full original PRU binary and direct ROM
        run: |
          set -euo pipefail
          arm-none-eabi-nm -n pokehns.elf > PRU-QA-symbols.sym
          python3 tools/pru/verify_compiled_rom.py
          test -f pokehns.gba
          test "$(stat -c%s pokehns.gba)" -eq 33554432
          sha256sum pokehns.gba | tee pru-rom.sha256
      - name: Load the compiled ROM and inspection save in mGBA
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PRU-QA/video-review/mgba
          cp assets/test_saves/PRU-70-Sprite-Inspection.sav pokehns.sav
          xvfb-run -a -s '-screen 0 1280x960x24' bash -euo pipefail -c '
            mgba-qt pokehns.gba >PRU-QA/video-review/mgba/mgba.log 2>&1 &
            emulator_pid=$!
            trap "kill $emulator_pid >/dev/null 2>&1 || true; wait $emulator_pid >/dev/null 2>&1 || true" EXIT
            for attempt in $(seq 1 30); do
              window_id=$(xdotool search --onlyvisible --name "mGBA" 2>/dev/null | head -n1 || true)
              test -n "$window_id" && break
              sleep 1
            done
            test -n "${window_id:-}"
            xdotool windowfocus "$window_id"
            sleep 5
            xdotool key Return
            sleep 8
            import -window root PRU-QA/video-review/mgba/inspection-save.png
          '
          test -s PRU-QA/video-review/mgba/inspection-save.png
          ! grep -Eiq 'fatal|segmentation fault|could not load|failed to load' PRU-QA/video-review/mgba/mgba.log
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('PRU-QA/video-review/mgba/inspection-save.png').convert('RGB')
          colors = image.getcolors(maxcolors=image.width * image.height)
          assert image.width >= 240 and image.height >= 160
          assert colors and len(colors) > 32
          print(f'mGBA rendered the inspection save: {image.width}x{image.height}, {len(colors)} colors')
          PY
      - name: Upload direct GBA test artifact after successful source build
        uses: actions/upload-artifact@v4
        with:
          name: PRU-CANONICAL-SOURCE-VALIDATED
          path: |
            pokehns.gba
            pru-rom.sha256
          if-no-files-found: error
      - name: Publish compiled raw GBA to GitHub prerelease
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/pru-indigo-tutors-20261027' || github.ref == 'refs/heads/fix/pru-a4d-mewduo-merge' || github.ref == 'refs/heads/fix/pru-challenges-mart-groudon-20261030' || github.ref == 'refs/heads/feat/pru-locked-gmax-charaxis-polish-20261031' || github.ref == 'refs/heads/feat/pru-relic-hunt-20261101')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'fix/pru-tutors-e4-from-pr54' || github.event.pull_request.head.ref == 'workmode/pru-playable-rom-20261027' || github.event.pull_request.head.ref == 'fix/pru-indigo-tutors-20261027' || github.event.pull_request.head.ref == 'fix/pru-challenges-mart-groudon-20261030'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s pokehns.gba
          test "$(stat -c%s pokehns.gba)" -eq 33554432
          # Older main jobs must never publish after main has advanced.
          if test "$GITHUB_REF" = "refs/heads/main"; then
            latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if test "$latest_main" != "$GITHUB_SHA"; then
              echo "SKIP_STALE_ROM: build $GITHUB_SHA is not current main $latest_main"
              exit 0
            fi
          fi
          tag="pru-build-$(git rev-parse --short=10 HEAD)"
          file="Pokemon-Relics-Ultimate-${GITHUB_SHA:0:10}.gba"
          cp pokehns.gba "$RUNNER_TEMP/$file"
          cp pokehns.gba "$RUNNER_TEMP/Pru.gba"
          cp assets/test_saves/Pru.sav "$RUNNER_TEMP/Pru.sav"
          cp assets/test_saves/PRU-70-Sprite-Inspection.sav "$RUNNER_TEMP/PRU-70-Sprite-Inspection.sav"
          zip -qr "$RUNNER_TEMP/PRU-Sprite-QA-Reports.zip" PRU-QA/sprite-audit-70.json PRU-QA/sprite-audit-70.md PRU-QA/compiled-sprite-audit-70.json PRU-QA/compiled-sprite-audit-70.md PRU-QA/contact-sheets PRU-QA/video-review
          zip -q "$RUNNER_TEMP/PRU-Sprite-Corrections.zip" \
            assets/pru_final_polish/fortotoise/ASSET_MANIFEST.md \
            assets/pru_final_polish/fortotoise/source_front.png \
            assets/pru_final_polish/fortotoise/back_source_crop.png \
            assets/pru_final_polish/fortotoise/icon.png \
            assets/pru_final_polish/fortotoise/front.png \
            assets/pru_final_polish/fortotoise/back.png \
            assets/pru_final_polish/fortotoise/normal.pal \
            graphics/pokemon/prl_authoritative/fortotoise/front.png \
            graphics/pokemon/prl_authoritative/fortotoise/back.png \
            graphics/pokemon/prl_authoritative/fortotoise/icon.png \
            graphics/pokemon/prl_authoritative/charaxis/icon.png \
            graphics/pokemon/ho_oh_relic/icon.png \
            graphics/pokemon/prl_authoritative/tropisaur/front.png \
            graphics/pokemon/prl_authoritative/tropisaur/back.png \
            graphics/pokemon/prl_authoritative/tropisaur/icon.png \
            graphics/pokemon/prl_authoritative/torkaldera/front.png \
            graphics/pokemon/prl_authoritative/torkaldera/back.png \
            graphics/pokemon/prl_authoritative/torkaldera/icon.png \
            graphics/pokemon/prl_authoritative/coelossus/icon.png \
            assets/pru_user_calf_sprites/miltitan/front.png \
            assets/pru_user_calf_sprites/miltitan/normal.pal \
            graphics/pokemon/prl_authoritative/miltitan/front.png \
            graphics/pokemon/prl_authoritative/miltitan/back.png \
            graphics/pokemon/prl_authoritative/miltitan/icon.png \
            assets/pru_user_calf_sprites/mootiny/front.png \
            assets/pru_user_calf_sprites/mootiny/normal.pal \
            graphics/pokemon/prl_authoritative/mootiny/front.png \
            graphics/pokemon/prl_authoritative/mootiny/back.png \
            graphics/pokemon/prl_authoritative/mootiny/icon.png \
            graphics/pokemon/prl_authoritative/gemlin/front.png \
            graphics/pokemon/prl_authoritative/gemlin/back.png \
            graphics/pokemon/prl_authoritative/jollibird/front.png \
            graphics/pokemon/prl_authoritative/jollibird/back.png \
            graphics/pokemon/prl_authoritative/kablowfish/front.png \
            graphics/pokemon/prl_authoritative/kablowfish/back.png \
            graphics/pokemon/prl_authoritative/grimfowl/front.png \
            graphics/pokemon/prl_authoritative/grimfowl/back.png \
            PRU-QA/video-review/report.json \
            PRU-QA/video-review/report.md \
            src/data/pokemon/species_info/pru_custom.h \
            graphics/pokemon/arbok/asudem/back.png \
            graphics/pokemon/nidoking/nidogod/back.png \
            graphics/pokemon/victreebel/redux/back.png \
            graphics/pokemon/tyranitar/mega_redux/back.png
          python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path
          root = Path('.')
          symbols = ("Nimbeon", "Drakeon", "Champeon", "Guardeon", "Toxeon", "Sphynxeon", "Skarmet", "Kablowfish", "Grimfowl", "Heracurion", "Scarabub", "Skarmadon", "Jollibird", "Osteodian", "Sunflorid", "Sudowarden", "Mystynx", "Ghoulbat", "Khang", "Fortotoise", "Charaxis", "HoOhRelic", "Hitmonlee", "Alakazam", "Gemlin", "Gemigoyle", "Astrachi", "Adnokana", "Cheauking", "Frytning", "Mewsion", "Tropisaur", "Coelossus", "Cactomb", "Torkaldera", "Sceptitan", "Solaziken")
          paths = {}
          pattern = re.compile(r'gMonIcon_(\w+)\[\]\s*=\s*INCBIN_U\d+\("([^\"]+)\.4bpp(?:\.smol)?"\)')
          for header in (root / "src/data/graphics/pjr.h", root / "src/data/graphics/pru_pokemon.h"):
              for symbol, rel in pattern.findall(header.read_text()):
                  paths[symbol] = root / (rel + ".png")
          paths.setdefault("Hitmonlee", root / "graphics/pokemon/hitmonlee/icon.png")
          paths.setdefault("Alakazam", root / "graphics/pokemon/alakazam/icon.png")
          archive = Path(os.environ["RUNNER_TEMP"]) / "PRU-Sprite-Corrections.zip"
          with zipfile.ZipFile(archive, "a", zipfile.ZIP_DEFLATED) as zf:
              for symbol in symbols:
                  path = paths[symbol]
                  zf.write(path, f"video-review/icons/{symbol}.png")
              for species in ("gemlin", "jollibird", "kablowfish", "grimfowl"):
                  for side in ("front", "back"):
                      path = root / "graphics/pokemon/prl_authoritative" / species / f"{side}.png"
                      zf.write(path, f"video-review/battle/{species}/{side}.png")
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/$file" "$RUNNER_TEMP/Pru.gba" "$RUNNER_TEMP/Pru.sav" "$RUNNER_TEMP/PRU-70-Sprite-Inspection.sav" "$RUNNER_TEMP/PRU-Sprite-QA-Reports.zip" "$RUNNER_TEMP/PRU-Sprite-Corrections.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/$file" "$RUNNER_TEMP/Pru.gba" "$RUNNER_TEMP/Pru.sav" "$RUNNER_TEMP/PRU-70-Sprite-Inspection.sav" "$RUNNER_TEMP/PRU-Sprite-QA-Reports.zip" "$RUNNER_TEMP/PRU-Sprite-Corrections.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Relics Ultimate — build ${GITHUB_SHA:0:10}" \
              --notes "32 MiB PRU ROM from commit $GITHUB_SHA, based on approved build #542. Restores accepted build-538 Eeveelutions, Mootiny/Miltitan and all preserved gameplay; adds supplied G-Max Blastoise Fortotoise front/back/icon, repaired PC icons and source-authentic Jessie & James backs. Includes the unchanged 70-species inspection save and source/compiled sprite QA reports. Ten E4 Relic back views remain unresolved because no authentic rear art is present in the pinned assets. No manual emulator visual review is claimed." \
              --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx "$file"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'Pru.gba'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'Pru.sav'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'PRU-70-Sprite-Inspection.sav'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'PRU-Sprite-QA-Reports.zip'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'PRU-Sprite-Corrections.zip'
          echo "DIRECT_GBA=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Pru.gba"
          echo "DIRECT_SAV=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Pru.sav"
          echo "INSPECTION_SAV=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/PRU-70-Sprite-Inspection.sav"
          echo "SPRITE_QA=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/PRU-Sprite-QA-Reports.zip"
          echo "SPRITE_CORRECTIONS=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/PRU-Sprite-Corrections.zip"

  prune-stale-attempts:
    name: Prune failed and cancelled historical PRU runs
    needs: build-rom
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove obsolete failed/cancelled attempts, preserve successful builds
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Retain every successful run and all release evidence. Only prune
          # failed/cancelled PRU canonical runs older than two hours.
          cutoff="$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.name == \"PRU canonical clean build\" and .status == \"completed\" and (.conclusion == \"failure\" or .conclusion == \"cancelled\") and .created_at < \"$cutoff\") | .id" \
            > "$RUNNER_TEMP/pru-stale-runs.txt"
          cleaned=0
          failed=0
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            test "$run_id" != "$GITHUB_RUN_ID" || continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null 2>&1; then
              cleaned=$((cleaned + 1))
            else
              failed=$((failed + 1))
              echo "Could not delete obsolete run $run_id"
            fi
            # Avoid bursting the GitHub Actions write API.
            sleep 0.4
          done < "$RUNNER_TEMP/pru-stale-runs.txt"
          echo "PRU_RUNS_CLEANED=$cleaned failures=$failed"

