name: Sync SpriteCook originals

on:
  push:
    paths:
      - "tools/spritecook/**"
      - ".github/workflows/spritecook-sync.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spritecook-originals
  cancel-in-progress: false

jobs:
  sync:
    env:
      SPRITECOOK_API_KEY: ${{ secrets.SPRITECOOK_API_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PRU
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer requirements
        run: python -m pip install --disable-pip-version-check requests Pillow

      - name: Explain missing key
        if: env.SPRITECOOK_API_KEY == ''
        run: echo "Add SPRITECOOK_API_KEY in Settings > Secrets and variables > Actions to enable sync."

      - name: Import recent SpriteCook artwork
        if: env.SPRITECOOK_API_KEY != ''
        env:
          SPRITECOOK_SYNC_LIMIT: "50"
        run: python tools/spritecook/sync_assets.py

      - name: Commit new original sprites
        if: env.SPRITECOOK_API_KEY != ''
        run: |
          git add -- assets/spritecook/incoming
          if git diff --cached --quiet; then
            echo "No new SpriteCook sprites."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(spritecook): sync original generated artwork"
          git push
