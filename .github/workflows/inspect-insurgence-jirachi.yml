name: Bank Insurgence Mega Jirachi original sprite artwork
on:
  push:
    branches: [pru/insurgence-mega-jirachi-art-20261022]
    paths:
      - .github/workflows/inspect-insurgence-jirachi.yml
      - tools/pru/bank_insurgence_mega_jirachi.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow image validation
        run: python -m pip install pillow
      - name: Fetch four original Insurgence Mega Jirachi sprite files
        run: python tools/pru/bank_insurgence_mega_jirachi.py
      - name: Inspect exact source palette and rectangle pixels
        run: python tools/pru/analyze_insurgence_jirachi.py
      - name: Uniform GBA 64x64 conversion and colour-paired shiny QA
        run: python tools/pru/install_insurgence_mega_jirachi.py
      - name: Commit original donor and GBA graphics for visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insurgence_mega_jirachi graphics/pokemon/jirachi
          git commit -m "Stage original Insurgence Mega Jirachi 64x64 battle art and palettes" || exit 0
          git push
