name: Bank Insurgence Mega Jirachi original sprite artwork
on:
  push:
    branches: [pru/insurgence-mega-jirachi-art-20261022]
    paths:
      - .github/workflows/inspect-insurgence-jirachi.yml
      - tools/pru/bank_insurgence_mega_jirachi.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow image validation
        run: python -m pip install pillow
      - name: Fetch four original Insurgence Mega Jirachi sprite files
        run: python tools/pru/bank_insurgence_mega_jirachi.py
      - name: Commit four verified original donor PNGs to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insurgence_mega_jirachi/source_*.png assets/insurgence_mega_jirachi/SOURCE.md
          git commit -m "Bank original Insurgence Mega Jirachi front/back normal/shiny" || exit 0
          git push
