name: PRU Eeveelutions approved sprite and PC save test

on:
  push:
    branches:
      - test/pru-eeveelutions-approved-sprites-20261118
    paths:
      - '.github/workflows/pru-eevee-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/pru-clean-build.yml
    permissions:
      contents: write

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled PRU ROM
        uses: actions/download-artifact@v4
        with:
          name: PRU-CANONICAL-SOURCE-VALIDATED
      - name: Validate and prepare direct ROM
        shell: bash
        run: |
          set -euo pipefail
          test -s pokehns.gba
          test "$(stat -c%s pokehns.gba)" -eq 33554432
          cp pokehns.gba PRU-Eeveelutions-Test-20261118.gba
          sha256sum PRU-Eeveelutions-Test-20261118.gba > PRU-Eeveelutions-Test-20261118.sha256
          test -s assets/test_saves/PRU_Eeveelutions_PC_Test.sav
          cp assets/test_saves/PRU_Eeveelutions_PC_Test.sav PRU-Eeveelutions-Test-20261118.sav
      - name: Publish direct test ROM, not a stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pru-eeveelutions-approved-test-20261118"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" PRU-Eeveelutions-Test-20261118.gba PRU-Eeveelutions-Test-20261118.sha256 PRU-Eeveelutions-Test-20261118.sav --clobber
          else
            gh release create "$tag" PRU-Eeveelutions-Test-20261118.gba PRU-Eeveelutions-Test-20261118.sha256 PRU-Eeveelutions-Test-20261118.sav --target "$GITHUB_SHA"               --title "PRU Alpha 5 — approved Eeveelutions sprite and PC save test"               --prerelease               --notes "Isolated Alpha 5 Eeveelutions sprite test. Approved Eeveelution sprite test with the dedicated Eeveelutions PC save. No intended changes to species data or events. Visual PC/battle QA remains to be done. Main PRU and PRR remain unchanged."
          fi
          echo "DIRECT_GBA=https://github.com/$GH_REPO/releases/download/$tag/PRU-Eeveelutions-Test-20261118.gba"
          echo "DIRECT_SAV=https://github.com/$GH_REPO/releases/download/$tag/PRU-Eeveelutions-Test-20261118.sav"
