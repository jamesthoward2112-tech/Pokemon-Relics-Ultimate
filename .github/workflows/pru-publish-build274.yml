name: PRU Blaine Hint — direct GBA release

on:
  push:
    branches:
      - pru/dojo-giovanni-e4-plan-20261025
    paths:
      - .github/workflows/pru-publish-build274.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-blaine-hint:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Publish tested Blaine Eighth Badge hint GBA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The published file must be exactly the compiled source at
          # c3b8722be5, not an earlier ROM or this publishing-only commit.
          gh run watch 40286112681 --repo "$GITHUB_REPOSITORY" --exit-status
          cd "$RUNNER_TEMP"
          mkdir -p pru-blaine
          gh run download 40286112681 --repo "$GITHUB_REPOSITORY" \
            --name PRU-CANONICAL-SOURCE-VALIDATED --dir pru-blaine
          cd pru-blaine
          test "$(stat -c%s pokehns.gba)" -eq 33554432
          sha256sum --check pru-rom.sha256
          tag="pru-build-c3b8722be5"
          file="Pokemon-Relics-Ultimate-c3b8722be5.gba"
          cp pokehns.gba "$file"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --target c3b8722be5d4cb7ddd375ecd1284733b96d198a0 \
              --title "Pokémon Relics Ultimate — Blaine's Final Badge Hint" \
              --notes "PRU clean build at c3b8722be5: Blaine now hints at the first city north of Pallet Town and the final eighth Kanto badge without naming Viridian. The ROM retains Dojo and Giovanni battle arenas. Source tests and a full ROM build passed. Live gameplay is not yet verified." \
              --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx "$file"
          echo "DIRECT_GBA=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$file"
